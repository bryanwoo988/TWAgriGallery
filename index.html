<!doctype html>
<html lang="en" data-theme="light" data-look="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taiwan Agri Gallery</title>
  <meta name="description" content="A catalogue of the 157 theme halls of Taiwan's Ministry of Agriculture, in English, 繁體中文, 简体中文 and Bahasa Melayu.">
  <meta name="theme-color" content="#f6f8f3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agri Gallery">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Apply the saved look before first paint, so a dark-mode reader never sees a white flash. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('twagri.prefs.v1') || '{}');
        var dark = p.mode === 'dark' || (p.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? 'dark' : 'light';
        r.dataset.look = dark ? (p.dark || 'midnight') : (p.light || 'classic');
      } catch (e) {}
    })();
  </script>
  <script src="js/whatsnew.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">

    </a>
    <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">

    </a>
  </header>
  <main id="main" class="wrap"><p class="loading">…</p></main>

</body>
</html>
