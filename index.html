  <script>
    /* Apply the saved look before first paint, so a dark-mode reader never sees a white flash. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('twagri.prefs.v1') || '{}');
        var dark = p.mode === 'dark' || (p.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? 'dark' : 'light';
        r.dataset.look = dark ? (p.dark || 'midnight') : (p.light || 'classic');
      } catch (e) {}
    })();
  </script>
  <script src="js/whatsnew.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Launch screen: shown from the first paint until the first page is ready (js/app.js hides it). -->
  <div id="splash" role="status" aria-live="polite">
    <img class="splash-mark" src="icons/icon.svg" alt="" width="96" height="96">
    <p class="splash-name" id="splash-name">Taiwan Agri Gallery</p>
    <p class="splash-sub" id="splash-sub">臺灣農業主題館</p>
    <div class="splash-bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    /* The launch screen in the reader's language, before any module loads. */
    (function () {
      var N = { en: ['Taiwan Agri Gallery', '臺灣農業主題館'], zht: ['臺灣農業主題館', 'Taiwan Agri Gallery'],
                zhs: ['台湾农业主题馆', 'Taiwan Agri Gallery'], ms: ['Galeri Pertanian Taiwan', '臺灣農業主題館'] };
      var lang = 'en';
      try { lang = JSON.parse(localStorage.getItem('twagri.prefs.v1') || '{}').lang || 'en'; } catch (e) {}
      var n = N[lang] || N.en;
      document.getElementById('splash-name').textContent = n[0];
      document.getElementById('splash-sub').textContent = n[1];
      // Never stuck: gone after 8 s even if something failed to load.
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 8000);
    })();
  </script>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="brand-mark" src="icons/icon.svg" alt="" width="32" height="32">
      <h1 id="app-title">Taiwan Agri Gallery</h1>
    </a>
    <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </a>
  </header>
